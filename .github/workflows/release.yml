name: Release

on:
  pull_request:
    branches: [stable]
    types: [closed]

permissions:
  contents: write

jobs:
  # Nothing else in this chain checks the tree it is about to publish. The
  # release job trusts the CI run of the pull request that was merged, and that
  # trust rests entirely on repository configuration — the ruleset that makes
  # the CI job a required check on `stable`. Configuration is not reviewed in a
  # pull request, does not travel in a fork and can be switched off without
  # leaving a trace in the tree, so the same guarantee is stated here as well,
  # where it is version-controlled.
  #
  # A job of its own rather than steps at the top of `release`, for a reason
  # steps cannot give: `release` checks out with a write token and runs under
  # `contents: write`, and executing the workspace's own test code inside that
  # job would run it beside credentials it has no business being near. This job
  # asks for `contents: read` and nothing else. The ordering then follows from
  # `needs` rather than from where a step happens to sit in a list: `release`
  # waits for this job, and `build`, `github-release` and `publish` all wait for
  # `release`, so no effectful step in the workflow — no version bump, no
  # commit, no tag, no release, no `cargo publish` — can begin until this job
  # has passed.
  verify:
    name: Verify the workspace
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # `ref: stable` rather than the merge ref: the tree that is about to be
      # published is the branch, and that is what has to be verified.
      - uses: actions/checkout@v4
        with:
          ref: stable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The whole suite, in release. The embedding invariant gate runs a full
      # pipeline over a four-megapixel container and a HILL cost map, which is
      # minutes of work in a debug build and half a minute in an optimised one;
      # everything else in the suite is small enough not to care which profile
      # it gets.
      - name: cargo test
        run: cargo test --workspace --release

      # The audit is repeated and the coverage floor is not, which is a
      # judgement about what each one measures. Coverage is a property of the
      # tree, and the tree has not changed since the pull request that was just
      # merged; re-measuring it would cost a `cargo install`, a second
      # instrumented build and a second run of the suite to reprint a number
      # already known. The advisory database is not a property of the tree: it
      # moves on its own, and a vulnerability published between the merge and
      # this run is exactly the kind of thing that must stop a release rather
      # than ship in one.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

  release:
    name: Version, build and publish
    needs: verify
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      next_version: ${{ steps.version.outputs.next }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      # The default GITHUB_TOKEN cannot push to `stable`: the branch ruleset
      # requires every change to go through a pull request, and that token has
      # no bypass entry. `stenoxide-release-bot` does, scoped to exactly this
      # job's need — an installation token minted fresh for this run, valid
      # only for its duration.
      - name: Generate a token for the release bot
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # `ref: stable` rather than the default: on a closed pull_request the
      # default checkout is the detached merge ref, which cannot be pushed back
      # to the branch. `fetch-depth: 0` brings the tags the version calculation
      # reads.
      - uses: actions/checkout@v4
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # One bump per change, applied in order — see next-version.sh. With no
      # previous tag the version already in Cargo.toml is taken as is, and a
      # hand-written version greater than the calculated one always wins, so a
      # deliberate bump in Cargo.toml is never overwritten.
      - name: Calculate next version
        id: version
        run: |
          set -o pipefail

          CURRENT=$(grep -m1 '^version' Cargo.toml | sed 's/version = "//;s/"//')
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          if [ "$LAST_TAG" = "none" ]; then
            echo "next=$CURRENT" >> $GITHUB_OUTPUT
            echo "release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CALCULATED=$(bash .github/scripts/changes.sh "${LAST_TAG}..HEAD" \
            | bash .github/scripts/next-version.sh "$CURRENT")

          if [ "$(printf '%s\n' "$CALCULATED" "$CURRENT" | sort -V | tail -1)" = "$CURRENT" ] && [ "$CURRENT" != "$CALCULATED" ]; then
            NEXT=$CURRENT
          else
            NEXT=$CALCULATED
          fi
          echo "next=$NEXT" >> $GITHUB_OUTPUT

          # Nothing moved the version, which happens when a merge carried only
          # dependency bumps. There is nothing to tag and nothing to publish, so
          # the rest of the pipeline stands down rather than failing on a tag
          # that already exists.
          if git rev-parse -q --verify "refs/tags/v${NEXT}" >/dev/null; then
            echo "release=false" >> $GITHUB_OUTPUT
            echo "v${NEXT} is already tagged; no release to make." >> $GITHUB_STEP_SUMMARY
          else
            echo "release=true" >> $GITHUB_OUTPUT
          fi

      # Both member crates inherit `version.workspace = true`, so the root
      # manifest is the only place the number itself lives. The one exception is
      # the registry requirement stenoxide-cli states on stenoxide-core, which
      # has to move with it or a major bump would leave the CLI asking for a
      # version range the newly published core no longer satisfies.
      #
      # Unconditional on purpose. When the version is raised by hand in
      # Cargo.toml the calculated version equals the current one, and a step
      # that only ran on a difference would skip exactly the case where the
      # dependency requirement was most likely left behind. Both edits are
      # no-ops when everything already agrees.
      - name: Synchronise version across the workspace
        if: steps.version.outputs.release == 'true'
        run: |
          NEXT=${{ steps.version.outputs.next }}
          sed -i "s/^version = \"${{ steps.version.outputs.current }}\"/version = \"$NEXT\"/" Cargo.toml
          sed -i "/^stenoxide-core = /s/version = \"[^\"]*\"/version = \"$NEXT\"/" stenoxide-cli/Cargo.toml
          cargo update --workspace

      - name: Generate changelog
        if: steps.version.outputs.release == 'true'
        # Read by `gh` inside changelog.sh, which asks the API which account is
        # behind each commit so the entry can credit it by handle. Without a
        # token the lookup fails quietly and the entries fall back to the name
        # recorded in the commit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=${{ steps.version.outputs.last_tag }}

          if [ "$LAST_TAG" = "none" ]; then
            RANGE=
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          # The same list that decided the version decides the sections, so the
          # changelog can never disagree with the number on the tag.
          bash .github/scripts/changes.sh $RANGE \
            | bash .github/scripts/changelog.sh \
                "${{ steps.version.outputs.next }}" \
                "${{ github.server_url }}/${{ github.repository }}" \
            > .changelog-entry

          # Rebuilt rather than prepended to: the new section belongs under the
          # document title, not above it.
          #
          # Everything above the first version section is carried over rather
          # than reprinted. That is where the title lives, and with it any prose
          # explaining the numbering itself — reprinting a bare title would
          # delete that note on the next release and leave the reader with the
          # jumps and no account of them.
          #
          # Any section already written for this version is dropped as the rest
          # is carried over, so the freshly rendered one replaces it instead of
          # joining it. That happens when a release commit landed but the run
          # that followed it did not finish — the tag is only created at the very
          # end, so nothing stops the same version being attempted again.
          {
            if [ -f CHANGELOG.md ] && grep -q '^## \[' CHANGELOG.md; then
              awk 'index($0, "## [") == 1 { exit } { print }' CHANGELOG.md
            else
              echo "# Changelog"
              echo
            fi
            cat .changelog-entry
            if [ -f CHANGELOG.md ]; then
              awk -v hdr="## [${{ steps.version.outputs.next }}]" '
                index($0, "## [") == 1 { skip = index($0, hdr) == 1; found = 1 }
                found && !skip        { print }
              ' CHANGELOG.md
            fi
          } > CHANGELOG.next

          mv CHANGELOG.next CHANGELOG.md
          rm .changelog-entry

      # No tag is pushed here. Everything downstream builds from this commit by
      # its sha, and the tag is created by the GitHub Release at the end of the
      # run — see "Create GitHub Release" below.
      - name: Commit version bump and changelog
        id: commit
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock stenoxide-cli/Cargo.toml CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore: release v${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:stable
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: stenoxide
            asset: stenoxide-linux-x86_64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: stenoxide.exe
            asset: stenoxide-windows-x86_64.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: stenoxide
            asset: stenoxide-macos-arm64

    steps:
      # The release commit by sha rather than by tag: the tag does not exist
      # yet, and this is the commit it will end up pointing at.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} \
             ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  github-release:
    name: Create GitHub Release
    needs: [release, build]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The release commit, not the merge ref: the changelog this job quotes was
      # written by the release job and only exists from that commit onwards.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Written to a file rather than a step output: release notes are
      # multi-line and would not survive interpolation into a YAML scalar.
      - name: Extract changelog for this version
        run: |
          awk -v hdr="## [${{ needs.release.outputs.next_version }}]" '
            index($0, hdr) == 1             { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found                           { print }
          ' CHANGELOG.md > release-notes.md

      # This is where the tag is created, on the release commit, in the same
      # call that attaches the binaries. Tagging earlier — in the release job,
      # before anything had been built — published a version number that pointed
      # at no downloadable release for as long as the builds took, and left one
      # behind for good whenever a build failed. A tag now appears only once
      # there is a release under it, and a failed build leaves the version
      # untagged and free to be released again.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.next_version }}
          target_commitish: ${{ needs.release.outputs.sha }}
          name: stenoxide v${{ needs.release.outputs.next_version }}
          body_path: release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false

  publish:
    name: Publish to crates.io
    needs: [release, github-release]
    if: needs.release.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # One workspace publication rather than two crate publications with a
      # sleep between them: cargo orders the members by their dependency graph
      # and waits for the registry to index each one before continuing, which
      # is the same thing a fixed sleep tries to approximate and does not.
      - name: Publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
