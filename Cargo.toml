[workspace]
resolver = "2"
members = ["stenoxide-core", "stenoxide-cli"]
# The fuzzing crate is a package inside this directory that is deliberately not
# a member of the workspace. Its targets need a nightly toolchain, sanitizer
# instrumentation and libFuzzer, so a plain `cargo build --workspace` must not
# reach for it and `cargo test --workspace` must not try to run it. It declares
# an empty `[workspace]` of its own as well; naming it here is what makes the
# arrangement visible from the side people read first.
exclude = ["fuzz"]

[workspace.package]
version = "3.24.3"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/stenoxide/stenoxide"
homepage = "https://github.com/stenoxide/stenoxide"
# The whole test tree is left out, not just the generated fixtures: the suite is
# linked against a build of the crate with `test-utils` enabled, and the
# dev-dependency that arranges it is a path dependency on this same package,
# which publishing strips. Shipping tests that cannot compile is worse than
# shipping none. `scripts` holds the steganalysis harness, which needs a Python
# toolkit that is not part of the crate. `examples` holds research harnesses
# that reach into `test_support` for the same reason the tests do, and are of
# no use to anyone consuming the library.
exclude = ["tests/*", "scripts/*", "examples/*"]

# Coverage runs the test profile with instrumentation, and instrumentation is
# per-codegen-unit: with the default parallel split a line can be attributed to
# whichever unit inlined it, which shows up as a coverage figure that moves
# between machines. One unit is slower to build and reports the same numbers
# everywhere, which is what a merge gate needs.
[profile.coverage]
inherits = "test"
codegen-units = 1

[workspace.dependencies]
image = "0.25"
# Already in the tree as a transitive dependency of `image`, which is where the
# lock file pins it. Promoting it to a direct dependency adds nothing to what is
# compiled; it only lets the container be written chunk by chunk instead of
# through the one-shot encoder above, which is what makes the file layout ours
# to choose.
png = "0.18"
zstd = "0.13"
argon2 = "0.5"
hkdf = "0.13"
sha3 = "0.12"
# Since 0.10 the XChaCha20-Poly1305 variant is part of the default surface;
# the separate "xchacha20poly1305" feature only existed up to 0.9.
chacha20poly1305 = "0.11"
# The `zeroize` feature makes the cipher wipe its internal state on drop; it is
# not enabled by default.
chacha20 = { version = "0.10", features = ["zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
rayon = "1.12"
rand = "0.10"
# 0.1.x no longer builds: it pins pre-release versions of `kem`/`hybrid-array`
# whose traits have since changed. 0.3 is the current ML-KEM release.
ml-kem = "0.3"
cc = "1.4"
clap = { version = "4.6", features = ["derive"] }
# Both are released from the `clap` repository and track the same minimum
# compiler as the version of `clap` above, which is what makes them safe to
# take: neither raises the MSRV recorded in this manifest.
clap_complete = "4.6"
clap_mangen = "0.3"
rpassword = "7.5"
tempfile = "3.27"
static_assertions = "1.1"
# Requires rustc 1.85, which is what sets `rust-version` above. Staying on
# 0.18.4 would have kept the older minimum; the newer release was taken
# deliberately and the minimum raised to match.
indicatif = "0.18.6"
