[workspace]
resolver = "2"
members = ["stenoxide-core", "stenoxide-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/stenoxide/stenoxide"

[workspace.dependencies]
image = "0.25"
zstd = "0.13"
argon2 = "0.5"
hkdf = "0.13"
sha3 = "0.12"
# Since 0.10 the XChaCha20-Poly1305 variant is part of the default surface;
# the separate "xchacha20poly1305" feature only existed up to 0.9.
chacha20poly1305 = "0.11"
# The `zeroize` feature makes the cipher wipe its internal state on drop; it is
# not enabled by default.
chacha20 = { version = "0.10", features = ["zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
rayon = "1.12"
rand = "0.10"
# 0.1.x no longer builds: it pins pre-release versions of `kem`/`hybrid-array`
# whose traits have since changed. 0.3 is the current ML-KEM release.
ml-kem = "0.3"
cc = "1.4"
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
tempfile = "3.27"
