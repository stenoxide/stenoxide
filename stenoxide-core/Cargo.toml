[package]
name = "stenoxide-core"
description = "Core steganography engine: image validation, cost analysis, cryptography and STC embedding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image.workspace = true
zstd.workspace = true
argon2.workspace = true
hkdf.workspace = true
sha3.workspace = true
chacha20poly1305.workspace = true
chacha20.workspace = true
zeroize.workspace = true
rayon.workspace = true
rand.workspace = true
ml-kem = { workspace = true, optional = true }

[build-dependencies]
cc.workspace = true

[features]
default = []
# Post-quantum key encapsulation support.
pqc = ["dep:ml-kem"]
# Compiles and links the libsdc++ Syndrome-Trellis Codes library in build.rs.
# Must stay disabled until PROMPT 6.
ffi-stc = []
